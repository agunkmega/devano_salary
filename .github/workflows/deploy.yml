name: Deploy to aaPanel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger aaPanel webhook
        run: |
          curl -s -X GET "${{ secrets.AAPANEL_WEBHOOK_URL }}" \
            --connect-timeout 10 --max-time 60
