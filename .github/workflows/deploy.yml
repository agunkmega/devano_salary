name: Deploy to aaPanel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger aaPanel webhook
        run: |
          curl -s -k -L "https://hrm.devanosilver.com:7800/hook?access_key=${{ secrets.AAPANEL_WEBHOOK_KEY }}" \
            --connect-timeout 60 --max-time 300 --retry 3 --retry-delay 5
